[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photostats"
version = "1.0.0"
description = "Photo Stats by Picstome.com — analyze the metadata of your photo library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Picstome.com" }]
keywords = ["photography", "exif", "metadata", "statistics", "raw"]
dependencies = ["PySide6>=6.8"]

[project.urls]
Homepage = "https://github.com/picstome/photostats"
Repository = "https://github.com/picstome/photostats"
Issues = "https://github.com/picstome/photostats/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.10"]

[project.gui-scripts]
photostats = "photostats.app:main"

[project.scripts]
photostats-cli = "photostats.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["photostats"]
# The translation catalogues are data, and must travel with the code.
artifacts = ["photostats/i18n/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"photostats/ui/*.py" = ["N"]
"tests/*.py" = ["E402"]